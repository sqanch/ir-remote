substitutions:
  name: ir-remote
  friendly_name: IR Remote

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

wifi:
  ssid:     !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: VERBOSE

api:
  password: !secret my_esp_api_pwd

ota:
  platform: esphome

remote_receiver:
  pin:
    number: D5
    inverted: true
  dump: nec # all

remote_transmitter:
  pin: D7
  carrier_duty_percent: 50%

button:
  - platform: template
    name: "On/Off NEC"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFB04
          command: 0xF708
  # add more buttons with your specific codes here
